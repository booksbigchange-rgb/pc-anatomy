name: Verify Latitude candidate
on:
  push:
    branches: [latitude-5410-model]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render and exercise Latitude
        run: |
          npm run dev > /tmp/atlas-vite.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          PW_TEST_SCREENSHOT_NO_FONTS_READY=1 timeout 400s node tests/browser/latitude.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latitude-verification
          path: verification/latitude

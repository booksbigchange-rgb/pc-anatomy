name: Apply dependency security fix

on:
  push:
    branches:
      - bigchange-school
    paths:
      - .github/workflows/security-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary dependency security fixer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: bigchange-school

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Patch Vite and lockfile
        run: npm install --save-dev --save-exact vite@8.3.1

      - name: Verify security
        run: npm audit --audit-level=high

      - name: Verify project
        run: |
          npm run check
          npm run lint
          npm test
          npm run build

      - name: Commit patched dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch Vite security advisories"
          git push origin HEAD:bigchange-school

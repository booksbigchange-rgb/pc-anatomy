name: Deploy Big Change preview
# Pages source must be set to GitHub Actions (not Deploy from a branch).

on:
  push:
    branches:
      - bigchange-school
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Pages site
        run: |
          npm run build
          node -e 'require("fs").writeFileSync("dist/version.json",JSON.stringify({commit:process.env.GITHUB_SHA}))' 
        env:
          GITHUB_PAGES: 'true'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify published OptiPlex interactions
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Confirm deployed commit and exercise live model
        env:
          ATLAS_TEST_URL: https://booksbigchange-rgb.github.io/pc-anatomy/
          PW_TEST_SCREENSHOT_NO_FONTS_READY: '1'
        run: |
          node --input-type=module - <<'JS'
          const url = process.env.ATLAS_TEST_URL + 'version.json';
          let matched = false;
          for (let i=0;i<12;i++) {
            const response = await fetch(url + '?commit=' + process.env.GITHUB_SHA);
            if (response.ok && (await response.json()).commit === process.env.GITHUB_SHA) { matched = true; break; }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!matched) throw new Error('Live preview does not serve the deployed commit');
          JS
          timeout 300s node tests/browser/optiplex.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-optiplex-verification
          path: verification

name: Verify OptiPlex candidate
on:
  push:
    branches: [optiplex-reference-model]
  pull_request:
    branches: [bigchange-school]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render and exercise candidate
        run: |
          npm run dev > /tmp/atlas-vite.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          PW_TEST_SCREENSHOT_NO_FONTS_READY=1 timeout 300s node tests/browser/optiplex.mjs
      - name: Capture official reference for visual comparison
        if: always()
        continue-on-error: true
        run: |
          mkdir -p verification/reference
          curl --fail --location --retry 2 --max-time 30 'https://www.originstorage.com/services/api/originstorage/model/manual/Optiplex%207040%20MT/Dell.pdf' -o verification/reference/dell-7040.pdf
          sudo apt-get install -y poppler-utils
          pdftoppm -f 9 -l 10 -scale-to 1400 -png verification/reference/dell-7040.pdf verification/reference/exterior
          pdftoppm -f 19 -l 19 -scale-to 1400 -png verification/reference/dell-7040.pdf verification/reference/psu
          pdftoppm -f 28 -l 28 -scale-to 1400 -png verification/reference/dell-7040.pdf verification/reference/board
          rm verification/reference/dell-7040.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optiplex-verification
          path: verification

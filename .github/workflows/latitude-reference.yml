name: Latitude service reference
on:
  push:
    branches: [latitude-5410-model]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir reference
          curl -fL --max-time 45 'https://www.originstorage.com/services/api/originstorage/model/manual/Latitude%205410/Dell.pdf' -o reference/service.pdf || curl -fL --max-time 45 'https://manuals.plus/m/2d90de61dda3717f218f0b30620986a680f5068a411468e0a5667a1241427043.pdf' -o reference/service.pdf
          curl -fL --max-time 30 'https://www.bhphotovideo.com/lit_files/633273.pdf' -o reference/specs.pdf
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftotext -layout reference/service.pdf reference/service.txt
          pdftoppm -f 20 -l 27 -scale-to 1300 -png reference/service.pdf reference/service
          pdftoppm -f 5 -l 10 -scale-to 1300 -png reference/specs.pdf reference/exterior
          rm reference/*.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latitude-reference
          path: reference

name: Refresh vulnerable dev dependencies

on:
  push:
    branches:
      - school-readiness-beta
    paths:
      - .github/workflows/dependency-refresh.yml
  pull_request:
    branches:
      - bigchange-school
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh formatter and lockfile
        run: |
          npm install --save-dev oxfmt@0.72.0
          npm audit fix
      - name: Security audit after refresh
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload refreshed dependency files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-refresh
          path: |
            package.json
            package-lock.json
      - name: Commit refreshed dependency files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore: refresh vulnerable dev dependencies"
            git push origin HEAD:school-readiness-beta
          fi

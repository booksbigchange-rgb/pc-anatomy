<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Computer Lab" />
    <meta name="theme-color" content="#15191a" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="description"
      content="A computer hardware lab for beginner students: set up a desktop, explore and take apart a PC, build one, open a laptop and practise Task Manager, all in the browser."
    />
    <title>BigChange Academy Computer Lab</title>
    <style>
      /*
        The block inside #root is for crawlers that do not run scripts and for
        visitors without JavaScript. With JavaScript it is dead the moment
        React mounts and clears #root — but the browser had already painted
        it, so every load began with a flash of a page nobody was meant to
        see. Hiding it costs those readers nothing: a crawler that does not
        run scripts does not apply this stylesheet either, and one that does
        run them gets the real application. The noscript rule below puts it
        back for the only visitor who needs it.
      */
      #no-script-intro {
        display: none;
      }
    </style>
    <noscript>
      <style>
        #no-script-intro {
          display: block;
        }
      </style>
    </noscript>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BigChange Academy Computer Lab" />
    <meta
      property="og:description"
      content="A computer hardware lab for beginner students: set up a desktop, explore and take apart a PC, build one, open a laptop and practise Task Manager, all in the browser."
    />
  </head>
  <body>
    <div id="root">
      <main
        id="no-script-intro"
        style="
          max-width: 760px;
          margin: 12vh auto;
          padding: 24px;
          font-family: system-ui;
          color: #e4e7e9;
          background: #15191a;
          border-radius: 16px;
        "
      >
        <h1>BigChange Academy Computer Lab</h1>
        <p>
          A computer hardware lab for beginner students: set up a desktop,
          explore and take apart a PC, build one, open a laptop and practise
          Task Manager.
        </p>
        <noscript
          ><p>
            This lab needs JavaScript and WebGL. Please turn on JavaScript.
          </p></noscript
        >
      </main>
    </div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
